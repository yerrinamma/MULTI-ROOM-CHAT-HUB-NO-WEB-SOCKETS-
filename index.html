 <!DOCTYPE html>
<html>
<head>
    <title>Multi-Room Chat Hub</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:linear-gradient(to right, #1a1a40, #6a0572);
            text-align:center;
            margin:0;
            padding:20px;
        }

        .container{
            max-width:700px;
            margin:auto;
            background:#ffffff;
            padding:20px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.4);
        }

        h1{
            color:#6a0572;
        }

        select{
            padding:10px;
            border-radius:5px;
            background:#ffb3c6;
            border:none;
            font-size:16px;
        }

        #chatBox{
            height:350px;
            border:2px solid #6a0572;
            overflow-y:auto;
            padding:10px;
            text-align:left;
            margin:20px 0;
            background:#f8e8ff;
            border-radius:10px;
        }

        .message{
            background:#d8b4fe;
            color:#2d033b;
            padding:10px;
            margin:8px 0;
            border-radius:8px;
        }

        input{
            width:70%;
            padding:10px;
            border:2px solid #6a0572;
            border-radius:5px;
        }

        button{
            padding:10px 15px;
            background:#e91e63;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#c2185b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Multi-Room Chat Hub</h1>

    <select id="room">
        <option value="general">General Room</option>
        <option value="sports">Sports Room</option>
        <option value="tech">Tech Room</option>
    </select>

    <div id="chatBox"></div>

    <input type="text" id="message" placeholder="Type your message">
    <button onclick="sendMessage()">Send</button>

</div>

<script>
const rooms = {
    general: [],
    sports: [],
    tech: []
};

let currentRoom = "general";

document.getElementById("room")
.addEventListener("change", function () {
    currentRoom = this.value;
    loadMessages();
});

function loadMessages() {

    const chatBox =
    document.getElementById("chatBox");

    chatBox.innerHTML = "";

    rooms[currentRoom].forEach(msg => {

        chatBox.innerHTML += `
        <div class="message">
            <b>${msg.user}</b>: ${msg.text}
        </div>`;

    });
}

function sendMessage() {

    const input =
    document.getElementById("message");

    const text =
    input.value.trim();

    if (text === "") return;

    rooms[currentRoom].push({
        user: "Shalini",
        text: text
    });

    input.value = "";

    loadMessages();
}

setInterval(loadMessages, 3000);

loadMessages();
</script>

</body>
</html>
