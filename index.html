<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Room Chat Hub</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #a1c4fd, #c2e9fb); /* soft blue gradient */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-container {
      background: #ffffff;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 400px;
      padding: 20px;
    }
    .room-buttons {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    .room-buttons button {
      flex: 1;
      margin: 0 5px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .room-buttons button:hover {
      transform: scale(1.05);
    }
    .room-a { background: #6a5acd; }   /* soft purple */
    .room-b { background: #ff6f91; }   /* coral pink */
    .room-c { background: #ffa931; }   /* warm orange */
    .chat-area {
      background: #e0f7fa; /* light aqua */
      border-radius: 10px;
      height: 250px;
      padding: 10px;
      margin-bottom: 15px;
      overflow-y: auto;
    }
    .chat-area h3 {
      margin: 0 0 10px;
      color: #333;
    }
    .input-area {
      display: flex;
    }
    .input-area input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }
    .input-area button {
      margin-left: 10px;
      padding: 10px 15px;
      background: #4caf50; /* green */
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .input-area button:hover {
      background: #43a047;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="room-buttons">
      <button class="room-a">Room A</button>
      <button class="room-b">Room B</button>
      <button class="room-c">Room C</button>
    </div>
    <div class="chat-area">
      <h3>Room A</h3>
      <!-- Messages will appear here -->
    </div>
    <div class="input-area">
      <input type="text" placeholder="Type a message...">
      <button>Send</button>
    </div>
  </div>
</body>
</html>
